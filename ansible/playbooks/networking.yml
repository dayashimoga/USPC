---
- name: Configure Headscale VPN & Firewall Isolation
  hosts: all
  tasks:
    - name: Ensure Headscale config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "~/.uspc/config/headscale"
        - "~/.uspc/data/headscale"

    - name: Configure UFW default deny policy
      community.general.ufw:
        direction: incoming
        policy: deny
      when: ansible_os_family == "Debian"

---
- name: Deploy Nextcloud, PostgreSQL, Redis, and USPC Media Stack
  hosts: all
  tasks:
    - name: Create USPC storage directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "~/.uspc/data/nextcloud"
        - "~/.uspc/data/postgres"
        - "~/.uspc/data/redis"
        - "~/.uspc/data/media_cache"
        - "~/.uspc/config/nextcloud"

    - name: Ensure Podman Pod exists
      containers.podman.podman_pod:
        name: uspc-pod
        state: started
        ports:
          - "8081:80"
          - "8085:8085"
          - "8080:8080"

apiVersion: v1
kind: Pod
metadata:
  name: uspc-pod
spec:
  containers:
    - name: uspc-redis
      image: docker.io/library/redis:7.2-alpine
      ports:
        - containerPort: 6379
          hostPort: 6379
      volumeMounts:
        - name: redis-data
          mountPath: /data
  volumes:
    - name: redis-data
      hostPath:
        path: ~/.uspc/data/redis

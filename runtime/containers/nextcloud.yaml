apiVersion: v1
kind: Pod
metadata:
  name: uspc-pod
spec:
  restartPolicy: Always
  containers:
    - name: uspc-nextcloud
      image: docker.io/library/nextcloud:27.1.4-apache
      ports:
        - containerPort: 80
          hostPort: 8081
      env:
        - name: POSTGRES_HOST
          value: "127.0.0.1"
        - name: POSTGRES_DB
          value: "nextcloud"
        - name: POSTGRES_USER
          value: "nextcloud"
        - name: REDIS_HOST
          value: "127.0.0.1"
      volumeMounts:
        - name: nextcloud-data
          mountPath: /var/www/html/data
        - name: nextcloud-config
          mountPath: /var/www/html/config
  volumes:
    - name: nextcloud-data
      hostPath:
        path: ~/.uspc/data/nextcloud
    - name: nextcloud-config
      hostPath:
        path: ~/.uspc/config/nextcloud

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: uspc
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: uspc
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'uspc-media'
        static_configs:
          - targets: ['uspc-media:8085']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uspc-prometheus
  namespace: uspc
  labels:
    app: uspc-prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: uspc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uspc-prometheus
  template:
    metadata:
      labels:
        app: uspc-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: data-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: uspc-prometheus
  namespace: uspc
  labels:
    app: uspc-prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: uspc-prometheus

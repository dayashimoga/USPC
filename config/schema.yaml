$schema: "http://json-schema.org/draft-07/schema#"
title: "USPC Configuration Schema"
type: "object"
required:
  - version
  - cloud
  - storage
  - network
  - services
  - media
  - backup
  - security
additionalProperties: false
properties:
  version:
    type: "string"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Configuration file version"
  cloud:
    type: "object"
    required:
      - name
      - environment
      - domain
    additionalProperties: false
    properties:
      name:
        type: "string"
        pattern: "^[a-zA-Z0-9_-]{3,32}$"
        description: "Cloud instance identifier"
      environment:
        type: "string"
        enum: ["production", "development", "testing"]
      domain:
        type: "string"
        description: "FQDN or private hostname for cloud instance"
      admin_user:
        type: "string"
        pattern: "^[a-zA-Z0-9_.@-]{3,64}$"
        default: "admin"
      admin_email:
        type: "string"
        format: "email"
  orchestrator:
    type: "object"
    additionalProperties: false
    properties:
      mode:
        type: "string"
        enum: ["appliance", "cluster", "k3s"]
        default: "appliance"
      namespace:
        type: "string"
        default: "uspc"
      k3s_version:
        type: "string"
        default: "v1.30.2+k3s1"
      node_role:
        type: "string"
        enum: ["server", "agent", "standalone"]
        default: "server"
      cluster_token_path:
        type: "string"
        default: "~/.uspc/secrets/k3s-token"
      scaling_policy:
        type: "string"
        enum: ["manual", "auto"]
        default: "manual"
  runtime:
    type: "object"
    additionalProperties: false
    properties:
      engine:
        type: "string"
        enum: ["auto", "podman", "docker"]
        default: "auto"
      rootless:
        type: "boolean"
        default: true
      vm_memory_mb:
        type: "integer"
        minimum: 2048
        default: 4096
      vm_cpus:
        type: "integer"
        minimum: 1
        default: 2
  storage:
    type: "object"
    required:
      - data_path
      - config_path
      - min_free_space_gb
    additionalProperties: false
    properties:
      data_path:
        type: "string"
        description: "Path for persistent cloud and media data"
      config_path:
        type: "string"
        description: "Path for cloud runtime state and configuration"
      min_free_space_gb:
        type: "number"
        minimum: 0.1
        default: 20
      profile:
        type: "string"
        enum: ["local", "nfs", "smb", "distributed"]
        default: "local"
      ha_mode:
        type: "string"
        enum: ["none", "replication", "distributed"]
        default: "none"
      external_mounts:
        type: "array"
        items:
          type: "string"
        default: []
  performance:
    type: "object"
    additionalProperties: false
    properties:
      profile:
        type: "string"
        enum: ["auto", "tiny", "small", "standard", "performance", "media"]
        default: "auto"
      auto_tune:
        type: "boolean"
        default: true
      max_concurrent_streams:
        type: "integer"
        minimum: 1
        maximum: 1000
        default: 10
      max_streams_per_user:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 3
      max_transcode_concurrency:
        type: "integer"
        minimum: 0
        maximum: 16
        default: 2
      rate_limit_requests_per_minute:
        type: "integer"
        minimum: 10
        maximum: 10000
        default: 600
      db_connection_pool_size:
        type: "integer"
        minimum: 5
        maximum: 200
        default: 20
      budgets:
        type: "object"
        additionalProperties: false
        properties:
          max_listing_p95_ms:
            type: "number"
            default: 50
          max_stream_start_p95_ms:
            type: "number"
            default: 100
          max_api_p99_ms:
            type: "number"
            default: 200
          max_startup_seconds:
            type: "number"
            default: 30
          max_concurrent_users:
            type: "integer"
            default: 50
          min_upload_throughput_mb_s:
            type: "number"
            default: 10
  monitoring:
    type: "object"
    additionalProperties: false
    properties:
      enabled:
        type: "boolean"
        default: true
      profile:
        type: "string"
        enum: ["minimal", "standard", "full", "cluster"]
        default: "minimal"
      prometheus_port:
        type: "integer"
        minimum: 1024
        maximum: 65535
        default: 9090
      grafana_port:
        type: "integer"
        minimum: 1024
        maximum: 65535
        default: 3000
      loki_port:
        type: "integer"
        minimum: 1024
        maximum: 65535
        default: 3100
      scrape_interval_seconds:
        type: "integer"
        minimum: 1
        maximum: 3600
        default: 15
      alert_evaluation_interval_seconds:
        type: "integer"
        minimum: 1
        maximum: 3600
        default: 60
      metrics_retention_days:
        type: "integer"
        minimum: 1
        maximum: 365
        default: 30
      metrics_max_size_mb:
        type: "integer"
        minimum: 10
        maximum: 10000
        default: 100
      alert_cpu_threshold:
        type: "number"
        minimum: 10
        maximum: 100
        default: 85
      alert_ram_threshold:
        type: "number"
        minimum: 10
        maximum: 100
        default: 90
      alert_disk_threshold:
        type: "number"
        minimum: 10
        maximum: 100
        default: 90
  profiles:
    type: "object"
    additionalProperties: false
    properties:
      active:
        type: "string"
        enum: ["auto", "appliance", "cluster", "dev", "test"]
        default: "auto"
      environment:
        type: "string"
        default: "appliance"
  tls:
    type: "object"
    additionalProperties: false
    properties:
      enabled:
        type: "boolean"
        default: false
      cert_path:
        type: "string"
        default: ""
      key_path:
        type: "string"
        default: ""
      auto_provision:
        type: "boolean"
        default: true
  network:
    type: "object"
    required:
      - mode
      - vpn_subnet
      - headscale_port
    additionalProperties: false
    properties:
      mode:
        type: "string"
        enum: ["private", "public"]
        default: "private"
      vpn_subnet:
        type: "string"
        pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$"
        default: "100.64.0.0/10"
      headscale_port:
        type: "integer"
        minimum: 1024
        maximum: 65535
        default: 8080
      public_http_port:
        type: "integer"
        minimum: 80
        maximum: 65535
        default: 80
      public_https_port:
        type: "integer"
        minimum: 443
        maximum: 65535
        default: 443
      enable_magic_dns:
        type: "boolean"
        default: true
  services:
    type: "object"
    required:
      - nextcloud
      - postgres
      - redis
    additionalProperties: false
    properties:
      nextcloud:
        type: "object"
        required:
          - version
          - port
        additionalProperties: false
        properties:
          version:
            type: "string"
            default: "27.1.4-apache"
          port:
            type: "integer"
            default: 8081
          memory_limit:
            type: "string"
            default: "1024M"
          upload_max_filesize:
            type: "string"
            default: "16G"
      postgres:
        type: "object"
        required:
          - version
          - port
          - db_name
          - user
        additionalProperties: false
        properties:
          version:
            type: "string"
            default: "16.1-alpine"
          port:
            type: "integer"
            default: 5432
          db_name:
            type: "string"
            default: "nextcloud"
          user:
            type: "string"
            default: "nextcloud"
      redis:
        type: "object"
        required:
          - version
          - port
        additionalProperties: false
        properties:
          version:
            type: "string"
            default: "7.2-alpine"
          port:
            type: "integer"
            default: 6379
  media:
    type: "object"
    required:
      - enabled
      - port
      - thumbnail_width
      - preview_width
      - max_transcode_jobs
      - background_processing
    additionalProperties: false
    properties:
      enabled:
        type: "boolean"
        default: true
      port:
        type: "integer"
        default: 8085
      thumbnail_width:
        type: "integer"
        minimum: 64
        maximum: 1024
        default: 320
      preview_width:
        type: "integer"
        minimum: 320
        maximum: 3840
        default: 800
      max_transcode_jobs:
        type: "integer"
        minimum: 1
        maximum: 16
        default: 2
      chunk_size_kb:
        type: "integer"
        minimum: 16
        maximum: 4096
        default: 64
      background_processing:
        type: "boolean"
        default: true
      index_on_upload:
        type: "boolean"
        default: true
      supported_video:
        type: "array"
        items:
          type: "string"
        default: ["mp4", "webm", "mov", "mkv", "avi", "wmv", "flv"]
      supported_audio:
        type: "array"
        items:
          type: "string"
        default: ["mp3", "aac", "m4a", "flac", "ogg", "opus", "wav", "wma"]
      supported_image:
        type: "array"
        items:
          type: "string"
        default: ["jpg", "jpeg", "png", "webp", "gif", "bmp", "svg", "tiff"]
  backup:
    type: "object"
    required:
      - enabled
      - target_type
      - retention_days
      - schedule
    additionalProperties: false
    properties:
      enabled:
        type: "boolean"
        default: true
      target_type:
        type: "string"
        enum: ["local", "external", "sftp"]
        default: "local"
      target_path:
        type: "string"
        default: "~/.uspc/backups"
      retention_days:
        type: "integer"
        minimum: 1
        default: 30
      schedule:
        type: "string"
        default: "0 2 * * *"
      verify_after_backup:
        type: "boolean"
        default: true
  security:
    type: "object"
    required:
      - enforce_mfa
      - auto_security_updates
      - firewall_enabled
    additionalProperties: false
    properties:
      enforce_mfa:
        type: "boolean"
        default: false
      auto_security_updates:
        type: "boolean"
        default: true
      firewall_enabled:
        type: "boolean"
        default: true
      tls_enabled:
        type: "boolean"
        default: false

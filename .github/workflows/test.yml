name: Automated Tests & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml tests/

      - name: Verify 95% Coverage Threshold
        if: runner.os == 'Linux'
        run: |
          coverage report --fail-under=95

      - name: Upload Coverage Report Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  browser-e2e:
    name: Browser E2E Tests (Playwright Container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Run E2E Test Container
        run: |
          docker build -t uspc-e2e -f tests/e2e/Dockerfile .
          docker run --rm uspc-e2e

  acceptance-gate:
    name: Production-Acceptance Gate & Evidence Generation
    runs-on: ubuntu-latest
    needs: [test, browser-e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Acceptance Audit & Export Evidence
        run: |
          mkdir -p reports
          cloudctl acceptance --full --output-dir reports/


      - name: Upload Acceptance Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: reports/



name: Security & Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit Static Analysis
        run: |
          pip install bandit
          bandit -r src/ -ll -ii

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc on

      - name: Check for Committed Secrets (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

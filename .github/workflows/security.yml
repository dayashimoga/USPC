name: Security & Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    name: Security Scans, SBOM & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools & dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install -e ".[dev]"

      - name: Run Bandit Static Analysis
        run: |
          pip install bandit
          bandit -r src/ -ll -ii

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc on

      - name: Check for Committed Secrets (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Generate SPDX 2.3 & CycloneDX 1.5 SBOMs
        run: |
          mkdir -p reports
          cloudctl sbom --format json --output reports/sbom-spdx.json
          cloudctl sbom --format cyclonedx --output reports/sbom-cyclonedx.json

      - name: Verify 100% Free & Open-Source License Compliance
        run: |
          cloudctl sbom --audit

      - name: Upload Security & SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-sbom-reports
          path: reports/

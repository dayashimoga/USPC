name: Build & Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Reproducible Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install -e ".[dev]"

      - name: Build Offline Bundle & Manifests
        run: |
          mkdir -p dist
          cloudctl bundle create --output "dist/uspc-release-${{ github.ref_name }}.tar.gz"
          cloudctl sbom --format json --output "dist/uspc-sbom-${{ github.ref_name }}.spdx.json"
          cloudctl sbom --format cyclonedx --output "dist/uspc-sbom-${{ github.ref_name }}.cdx.json"

      - name: Generate Cryptographic SHA-256 Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

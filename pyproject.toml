[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uspc"
version = "0.1.0"
description = "Universal Personal Cloud Platform - 100% Free & Open-Source, Vendor-Independent Personal Cloud"
readme = "README.md"
authors = [
    { name = "USPC Project Maintainers", email = "maintainers@uspc.local" }
]
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.0",
    "jsonschema>=4.20.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
]

[project.scripts]
cloudctl = "cloudctl.cli:main"
uspc-media = "media.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"


[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "E402"]
